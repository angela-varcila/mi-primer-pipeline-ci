name: Pipeline de Integracion Continua y publicacion de imagenes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read


jobs:
  verificar:
    name: Ejecutar pruebas #--Verificar codigo Python
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q calculadora.py test_calculadora.py

      - name: Crear carpeta de reportes
        run: mkdir -p reportes

      - name: Ejecutar pruebas y generar reporte
        run: python -m pytest -v --junitxml=reportes/pruebas.xml

      - name: Guardar reporte como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: reportes/pruebas.xml
  

  trivy:
    name: Analizar imagen Docker (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    needs: [verificar, gitleaks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar QEMU para emular otras arquitecturas
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de la arquitectura que se analizará
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --load \
            -t calculadora-cd:scan-${{ matrix.suffix }} \
            .

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Escanear imagen y bloquear vulnerabilidades altas o críticas
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            calculadora-cd:scan-${{ matrix.suffix }}


  gitleaks:
    name: Detectar secretos
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ejecutar Gitleaks sobre archivos actuales
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:latest \
            detect --source=/path --no-git --redact --exit-code=1





  publish:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [verificar, gitleaks, trivy] #verificar #test
    # Publicar solo desde push a main, no desde pull_request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
 
    permissions:
      contents: read
      packages: write
 
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
 
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Generar etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Reemplaza con tu usuario u organización y el nombre del paquete,
          # todo en minúsculas. Ejemplo: ghcr.io/equipo/calculadora-cd
          #images: ghcr.io/USUARIO/calculadora-cd
          images: ghcr.io/angela-varcila/calculadora-cd
          tags: |
            type=sha
            type=raw,value=latest
 
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

